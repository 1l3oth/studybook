<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No signal · 스터디북</title>
<meta name="theme-color" content="#1C2A4A">
<style>
:root{--f:'Gothic A1',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;--ground:#EEF0F4;--ink:#16203A;--ink-2:#4F5970;--line:#00A84D;--line-ink:#00803A}
@media (prefers-color-scheme:dark){:root{--ground:#0E1322;--ink:#EEF1F8;--ink-2:#AAB3C7;--line:#16B95E}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--f);line-height:1.5;min-height:100vh}
.stripe{height:8px;background:var(--line)}
.wrap{max-width:640px;margin:0 auto;padding:0 1.1rem}
main{padding-top:3rem}
h1{font-size:1.6rem;font-weight:800;margin:0 0 .4rem;word-break:keep-all}
p{color:var(--ink-2);margin:0 0 1.4rem}
button{font:800 1rem var(--f);min-height:52px;width:100%;border:0;border-radius:12px;background:var(--line-ink);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"></div>
<main class="wrap">
  <h1>신호가 없어요</h1>
  <p>No signal. Studybook needs the internet to open a unit. Try again when you are connected.</p>
  <button type="button" onclick="location.reload()">다시 시도 · Try again</button>
</main>
</body>
</html>
